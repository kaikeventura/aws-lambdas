[package]
name = "aws-lambdas-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_runtime = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
aws-config = "1.0"
aws-sdk-dynamodb = "1.0"
jsonwebtoken = "9.2"
bcrypt = "0.15"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
simple_logger = "4.3"

[dev-dependencies]
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["localstack"] }
aws-credential-types = "1.0"
aws-smithy-types = "1.0"
aws-smithy-runtime-api = "1.0"
uuid = { version = "1.6", features = ["v4"] }
