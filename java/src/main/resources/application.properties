# Configuration for AWS Lambda
quarkus.lambda.handler=io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler

# Enable Virtual Threads (Project Loom)
quarkus.virtual-threads.enabled=true

# Native Image Configuration
quarkus.native.additional-build-args=--initialize-at-build-time=org.slf4j.impl.StaticLoggerBinder

# DynamoDB Configuration
quarkus.dynamodb.aws.region=us-east-1
# Force usage of URL Connection Client (required for native mode compatibility in some contexts)
quarkus.dynamodb.sync-client.type=url
