# DynamoDB Configuration
# O nome da tabela. Pode ser sobrescrito pela variável de ambiente TABLE_NAME.
quarkus.dynamodb.table-name=${TABLE_NAME:UsersTable}

# JWT Configuration
# O Smallrye JWT usará a chave em /resources/privatekey.jwk para ASSINAR os tokens.
# A validação será feita programaticamente.
smallrye.jwt.sign.key.location=/privatekey.jwk
# O issuer é necessário para a geração do token.
mp.jwt.verify.issuer=https://example.com/issuer
